# Lint, unit tests, and Security Rules tests on every PR and every push to main.
#
# Why this exists (BB-244): until now the only workflows were deploy-only, so
# nothing ever ran `ng lint` or a test suite in CI. 18 frontend lint errors and 2
# in functions accumulated on main unnoticed, and a source that had silently
# stopped ingesting went unnoticed for months. Deploys stay separate — this
# workflow never touches Firebase and needs no secrets.
#
# Three independent jobs so a functions failure doesn't mask a frontend one, and
# so they run in parallel.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # So the workflow can be exercised from the Actions tab without opening a PR.
  workflow_dispatch:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # test:cov, not test — the coverage FLOORS in jest.config.js (BB-246) are
      # only evaluated when coverage is actually collected, so plain `npm test`
      # would leave the ratchet unenforced.
      # --ci: never write snapshots on CI. --runInBand: one worker. The suite
      # takes ~55s serial vs ~20s parallel, which is worth paying — parallel
      # Angular/jsdom workers are the usual cause of OOM and "worker process
      # failed to exit gracefully" flakes on small runners, and a CI that fails
      # intermittently is worse than a CI that takes another half minute.
      - name: Unit tests + coverage floor
        run: npm run test:cov -- --ci --runInBand

  functions:
    name: Functions (lint + build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Lint
        run: npm run lint
        working-directory: functions

      # Catches type errors the unit tests wouldn't, and mirrors what deploy does.
      - name: Build
        run: npm run build
        working-directory: functions

      # test:cov so the coverage floors in functions/jest.config.js are enforced.
      - name: Unit tests + coverage floor
        run: npm run test:cov -- --ci --runInBand
        working-directory: functions

  rules:
    name: Firestore Security Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # The Firestore emulator is a Java process, and firebase-tools refuses to
      # start it on anything below JDK 21 ("no longer supports Java version
      # before 21"). 21 is the current LTS and the documented floor — if a future
      # firebase-tools raises the minimum again, this is the line to bump.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      # firebase-tools is deliberately NOT a dependency of the app (it's a heavy
      # CLI, not a runtime need), so CI installs it. Pinned for reproducibility —
      # bump deliberately rather than letting a CLI release break the build.
      - name: Install Firebase CLI
        run: npm i -g firebase-tools@15.24.0

      # Emulators need no Firebase credentials, so the CLI's "You are not
      # currently authenticated" line is expected noise here, not a failure —
      # the emulator reads the project id from .firebaserc (bourbonbuddy-dev)
      # and never talks to a real project.
      - name: Rules tests
        run: npm run test:rules
